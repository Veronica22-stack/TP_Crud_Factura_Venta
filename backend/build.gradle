plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tpgrupal'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
    // 1. Le decimos a Gradle que busque también en la carpeta libs local
    flatDir {
        dirs 'libs'
    }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.github.librepdf:openpdf:1.3.39'
    // BCrypt para encriptar las claves del login (solo la parte de criptografia, sin Spring Security completo)
    implementation 'org.springframework.security:spring-security-crypto'
    // Bouncy Castle para la firma CMS (PKCS#7) del WSAA
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78'
    // Cliente SOAP (JAX-WS) para WSFEv1, version jakarta
    // Se excluye com.sun.xml.bind (jaxb-impl/jaxb-core): es una segunda copia de JAXB que choca con
    // org.glassfish.jaxb:jaxb-runtime (la que trae Spring Boot y la que usa jaxws-rt). Con las dos,
    // bootJar falla por "jaxb-core-4.0.9.jar is a duplicate".
    implementation('com.sun.xml.ws:jaxws-rt:4.0.2') {
        exclude group: 'com.sun.xml.bind'
    }
    // Esto le indica a Gradle que busque y use todos los .jar dentro de la carpeta libs

    //bcpkix-jdk15to18-1.81.jar,bcprov-jdk15to18-1.81.jar,bcutil-jdk15to18-1.81.jar
    // 2. Aquí declaras los JARs de Axis/JAX-WS del profe por su nombre (sin el .jar al final)
    // Dejá los JARs de AFIP del WSFE/WSAA que sí van en la carpeta libs mediante fileTree o flatDir,
    // o declaralos bien limpios:
    implementation fileTree(dir: 'libs', include: ['*.jar'])
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Driver de MySQL (solo una vez)
	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
