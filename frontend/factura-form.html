<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de la Factura</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <h1 class="title" id="formTitulo">Datos de la Factura</h1>
      <a href="./index.html" class="btn btn-outline">← Volver al Listado</a>
    </header>

    <div class="card">
      <form id="facturaForm">
        <!-- Cabecera -->
        <div class="form-grid">
          <div class="form-group">
            <label for="numeroFacturaInput">Número de Factura</label>
            <input type="text" id="numeroFacturaInput" class="form-control" readonly
              placeholder="Se asigna automáticamente al crear.">
          </div>

          <div class="form-group">
            <label for="fechaEmisionInput">Fecha de Emisión</label>
            <input type="date" id="fechaEmisionInput" class="form-control" required>
          </div>

          <div class="form-group cliente-group">
            <label for="clienteTexto">Cliente</label>
            <div class="input-with-button">
              <input type="text" id="clienteTexto" class="form-control" placeholder="Seleccione un cliente">
              <select id="clienteSelect" style="display: none;" required>
                <option value="">Cargando clientes...</option>
              </select>
              <button type="button" id="btnAbrirExplorer" class="btn btn-secondary btn-icon"
                title="Abrir explorador de clientes">Explorar</button>
            </div>
          </div>

          <div class="form-group">
            <label for="condicionIvaSelect">Condición IVA</label>
            <select id="condicionIvaSelect" class="form-control" required>
              <option value="">Cargando condiciones IVA...</option>
            </select>
          </div>
        </div>

        <div class="form-group cliente-group">
          <label for="listaPrecioTexto">Lista de Precios</label>
          <div class="input-with-button">
            <input type="text" id="listaPrecioTexto" class="form-control" placeholder="Seleccione una lista de precios"
              readonly>
            <button type="button" id="btnAbrirExplorerListas" class="btn btn-secondary btn-icon"
              title="Abrir explorador de listas de precios">Explorar</button>
          </div>
        </div>

        <!-- Detalles -->
        <div class="section-detalles-header">
          <h2 class="section-subtitle">Detalles</h2>
          <button type="button" id="btnAgregarItem" class="btn btn-success">+ Agregar Ítem</button>
        </div>

        <div class="detalles-table-container">
          <table class="detalles-table">
            <thead>
              <tr>
                <th style="width: 20%;">Rubro</th>
                <th style="width: 30%;">Producto</th>
                <th style="width: 10%;">Cantidad</th>
                <th style="width: 15%;">Precio Unitario</th>
                <th style="width: 15%;">Subtotal</th>
                <th style="width: 10%;" class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="detallesTableBody">
            </tbody>
          </table>
        </div>

        <!-- Total -->
        <div class="importe-total-bar">
          <span>Importe Total:</span>
          <span id="importeTotalDisplay" class="importe-total-valor">$ 0,00</span>
        </div>

        <!-- Botones de accion -->
        <div class="form-actions">
          <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar</button>
          <button type="button" id="btnCancelar" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Explorador de Clientes -->
  <div id="modalClientes" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Explorador de Clientes</h3>
        <button type="button" id="btnCerrarModal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-search">
          <input type="text" id="inputBuscarCliente" class="form-control" placeholder="Buscar por nombre o CUIT...">
        </div>
        <div class="modal-table-container">
          <table class="clientes-table">
            <thead>
              <tr>
                <th>CUIT / CUIL</th>
                <th>Denominación / Razón Social</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="clientesTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/factura-form.ts"></script>
</body>

</html>
